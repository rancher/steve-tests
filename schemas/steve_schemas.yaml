# Qase case definitions for steve-tests.
#
# Each top-level Go test under tests/ is one Qase case; subtest results are
# summarized in the case's result comment. schemas_test.go fails when a test is
# added, renamed, or removed without updating this file.
#
# Upload with:
#   QASE_AUTOMATION_TOKEN=... go run ./pipeline/qase/schemaupload
